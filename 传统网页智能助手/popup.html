<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>传统网页智能助手</title>
</head>
<body>
  <header class="app-header">
    <div class="header-title">传统网页智能助手</div>
    <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
  </header>

  <section id="settingsPanel" class="settings-panel hidden">
    <label>API 地址
      <input id="apiBase" type="text" placeholder="https://api.deepseek.com/v1" />
    </label>
    <label>API Key
      <input id="apiKey" type="password" placeholder="sk-..." />
    </label>
    <label>模型
      <input id="model" type="text" placeholder="deepseek-chat" />
    </label>
    <label>最大步数
      <input id="maxSteps" type="number" min="1" max="100" placeholder="15" />
    </label>
    <div class="settings-actions">
      <button id="saveConfig" class="btn primary">保存</button>
      <button id="testConfig" class="btn">测试连接</button>
    </div>
    <div id="settingsStatus" class="settings-status"></div>
  </section>

  <div id="connStatus" class="conn-status"></div>

  <section id="attachArea" class="attach-area hidden">
    <div id="chips" class="chips"></div>
    <button id="addFile" class="btn add-file">＋ 添加文件</button>
    <input id="fileInput" type="file" multiple hidden />
  </section>

  <div id="messages" class="messages"></div>

  <div class="input-row">
    <textarea id="userInput" rows="2"
      placeholder="描述你要做的操作，例如：为张三提交事假申请，日期明天，并上传附件"></textarea>
    <button id="sendBtn" class="btn primary send-btn">发送</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
