<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>键盘选择控件</title>
  <style>
    #box { width: 240px; border: 1px solid #888; padding: 4px; }
    #box [role=option] { padding: 4px; }
    #box [aria-selected=true] { background: #cde; }
  </style>
</head>
<body>
  <h1>选择审批级别</h1>
  <p>用方向键移动，按 Enter 确认。这个控件只响应键盘。</p>
  <div id="box" role="listbox" tabindex="0" aria-label="审批级别" aria-activedescendant="opt0">
    <div role="option" id="opt0" aria-selected="true">一级</div>
    <div role="option" id="opt1" aria-selected="false">二级</div>
    <div role="option" id="opt2" aria-selected="false">三级</div>
  </div>
  <p id="msg"></p>
  <script>
    var box = document.getElementById('box');
    var idx = 0;
    var opts = box.querySelectorAll('[role=option]');
    function paint() {
      opts.forEach(function (o, i) { o.setAttribute('aria-selected', i === idx ? 'true' : 'false'); });
      box.setAttribute('aria-activedescendant', opts[idx].id);
    }
    box.addEventListener('keydown', function (ev) {
      if (!ev.isTrusted) return;
      if (ev.key === 'ArrowDown') { idx = Math.min(opts.length - 1, idx + 1); paint(); ev.preventDefault(); }
      else if (ev.key === 'ArrowUp') { idx = Math.max(0, idx - 1); paint(); ev.preventDefault(); }
      else if (ev.key === 'Enter') {
        var level = opts[idx].textContent;
        fetch('/submit/keyboard-only', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level: level })
        }).then(function () { document.getElementById('msg').textContent = '已提交 ' + level; });
      }
    });
  </script>
</body>
</html>
