<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>富文本编辑器</title>
  <style>#editor { min-height: 120px; border: 1px solid #aaa; padding: 8px; width: 480px; }</style>
</head>
<body>
  <h1>周报</h1>
  <div id="editor" contenteditable="true" role="textbox" aria-label="周报正文" aria-multiline="true"></div>
  <button id="save" type="button">保存周报</button>
  <p id="msg"></p>
  <script>
    document.getElementById('save').addEventListener('click', function () {
      fetch('/submit/contenteditable', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: document.getElementById('editor').innerText.trim() })
      }).then(function () { document.getElementById('msg').textContent = '已提交'; });
    });
  </script>
</body>
</html>
