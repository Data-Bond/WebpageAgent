<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页智能体助手 · 全局配置</title>
  <style>
    :root {
      --bg: #eef1f8;
      --card: #ffffff;
      --text: #23283a;
      --muted: #5a6072;
      --line: #e6e8f0;
      --accent: #4f7cff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    .page-header {
      margin-bottom: 18px;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.3px;
    }
    .lang-switch {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-size: 16px;
      color: var(--muted);
      line-height: 1.4;
    }
    .lang-switch-btn {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 2px;
      font-family: inherit;
      line-height: inherit;
    }
    .lang-switch-btn:hover {
      text-decoration: underline;
    }
    .sub {
      color: var(--muted);
      margin-top: 4px;
      font-size: 15px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(35, 40, 58, 0.05);
    }
    .heading {
      font-size: 16px;
      font-weight: 700;
      color: #4a5270;
      margin-bottom: 10px;
    }
    .subhead {
      font-size: 15px;
      font-weight: 700;
      color: #4a5270;
      margin: 16px 0 6px;
    }
    .skill-export-list {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f7f8fc;
      max-height: 280px;
      overflow: auto;
      padding: 4px 8px;
      margin: 6px 0 8px;
    }
    .skill-export-empty {
      padding: 10px 4px;
      color: var(--muted);
      font-size: 15px;
    }
    .skill-export-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 2px;
      border-bottom: 1px solid var(--line);
    }
    .skill-export-row:last-child { border-bottom: none; }
    .skill-export-row input { margin-top: 3px; flex: 0 0 auto; }
    .skill-export-meta { min-width: 0; }
    .skill-export-name { font-weight: 600; color: var(--text); }
    .skill-export-url {
      color: var(--muted);
      font-size: 14px;
      word-break: break-all;
    }
    label.field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="range"],
    select,
    textarea {
      border: 1px solid #d8dbe7;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 16px;
      outline: none;
      background: #fbfcfe;
      font-family: inherit;
      width: 100%;
    }
    textarea {
      min-height: 72px;
      resize: vertical;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 640px) {
      .row-2 { grid-template-columns: 1fr; }
    }
    .check-row {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 15px;
      color: var(--muted);
    }
    .check-row input { width: auto; margin: 0; }
    .hint {
      font-size: 14px;
      color: #8a90a0;
      line-height: 1.45;
      margin: 4px 0 8px;
    }
    .io-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn {
      border: 1px solid #d8dbe7;
      background: #fff;
      color: #2b2f3a;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #f6f7fb; }
    .btn.primary {
      background: linear-gradient(135deg, #4f7cff 0%, #6a5cff 100%);
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .btn.danger {
      color: #b42318;
      border-color: #f3c4c0;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      position: sticky;
      bottom: 0;
      background: linear-gradient(180deg, rgba(238,241,248,0.2), var(--bg) 30%);
      padding: 12px 0 8px;
    }
    .status {
      min-height: 20px;
      font-size: 15px;
      color: var(--muted);
    }
    .status.ok { color: #1f7a4d; }
    .status.err { color: #b42318; }
    .provider-list { display: flex; flex-direction: column; gap: 10px; }
    .provider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 12px 12px 14px;
      border: 1px solid #d8dbe7;
      border-left-width: 7px;
      border-radius: 12px;
    }
    .provider-list .provider-row:nth-child(8n+1) {
      background: #dceaff;
      border-color: #9bb8f0;
      border-left-color: #2f6bff;
    }
    .provider-list .provider-row:nth-child(8n+2) {
      background: #d8f4e8;
      border-color: #8fd0b0;
      border-left-color: #1a9a62;
    }
    .provider-list .provider-row:nth-child(8n+3) {
      background: #fff1cc;
      border-color: #e8c56a;
      border-left-color: #d97706;
    }
    .provider-list .provider-row:nth-child(8n+4) {
      background: #eadfff;
      border-color: #c4a8f0;
      border-left-color: #7a4ad6;
    }
    .provider-list .provider-row:nth-child(8n+5) {
      background: #ffd9e4;
      border-color: #f0a3b8;
      border-left-color: #d63d6e;
    }
    .provider-list .provider-row:nth-child(8n+6) {
      background: #d5f3fb;
      border-color: #8ed0e3;
      border-left-color: #0e8aa8;
    }
    .provider-list .provider-row:nth-child(8n+7) {
      background: #e8f5c8;
      border-color: #b5d46a;
      border-left-color: #5b8c12;
    }
    .provider-list .provider-row:nth-child(8n+8) {
      background: #ffe0cc;
      border-color: #f0b089;
      border-left-color: #c45c26;
    }
    .provider-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 14px;
      color: var(--muted);
    }
    .provider-sample-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }
    .provider-sample-label {
      font-size: 14px;
      color: var(--muted);
    }
    .provider-sample-copy {
      flex: 0 0 auto;
      padding: 3px 10px;
      font-size: 14px;
    }
    .provider-sample {
      margin: 0;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(35, 40, 58, 0.12);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 240px;
      overflow: auto;
      user-select: text;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #2a3148;
    }
    .provider-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .provider-actions .btn { flex: 1; }
    .model-id-list {
      max-height: 360px;
      overflow: auto;
      margin-top: 8px;
    }
    .modal[hidden] { display: none !important; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(24, 28, 42, 0.42);
    }
    .modal-dialog {
      position: relative;
      z-index: 1;
      width: min(640px, 100%);
      max-height: min(82vh, 720px);
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(24, 28, 42, 0.22);
      padding: 18px 18px 16px;
    }
    .modal-dialog.wide { width: min(640px, 100%); }
    .export-cols {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .export-col {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px 12px;
      background: #f7f8fc;
    }
    .export-col-title {
      font-size: 16px;
      font-weight: 700;
      color: #4a5270;
      margin-bottom: 8px;
    }
    .export-hours {
      margin: 6px 0 0 22px;
    }
    .export-hours .field { margin-bottom: 0; }
    .modal-x {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: #5a6072;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      border-radius: 8px;
    }
    .modal-x:hover { background: #f3f5fb; color: #23283a; }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      padding-right: 36px;
      margin-bottom: 8px;
    }
    .modal-pre {
      margin: 0;
      padding: 10px 12px;
      background: #f6f7fb;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 56vh;
      overflow: auto;
      user-select: text;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .modal-pre.ok { color: #1f7a4d; }
    .modal-pre.err { color: #b42318; }
    #webdavListHint { white-space: pre-wrap; word-break: break-all; }
    .dav-list-scroll {
      direction: rtl;
      height: 280px;
      overflow-y: scroll;
      margin: 8px 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f6f7fb;
      scrollbar-color: #6d758c #e4e7f0;
      scrollbar-width: auto;
    }
    .dav-list-scroll::-webkit-scrollbar { width: 12px; }
    .dav-list-scroll::-webkit-scrollbar-track { background: #e4e7f0; }
    .dav-list-scroll::-webkit-scrollbar-thumb { background: #6d758c; border-radius: 6px; }
    .dav-list-scroll > div { direction: ltr; text-align: left; }
    .dav-entry {
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      word-break: break-all;
    }
    .dav-entry:last-child { border-bottom: none; }
    .dav-list-actions { margin-top: 4px; }
    .export-group {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #fbfcfe;
    }
    .export-parent, .export-leaf {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
    }
    .export-parent { font-weight: 700; }
    .export-parent input, .export-leaf input { margin-top: 2px; flex: 0 0 auto; }
    .export-children {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 8px 0 0 22px;
    }
    .export-leaf { font-weight: 400; color: #3b4154; }
    .range-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .range-row input[type="range"] { flex: 1; padding: 0; }
    .range-val {
      min-width: 52px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div class="title-row">
        <h1 data-i18n="settings.title"></h1>
        <span class="lang-switch">
          <span id="langSwitchLabel" data-i18n="settings.langSwitchLabel"></span>
          <button type="button" class="lang-switch-btn" id="langToggleBtn" data-i18n="settings.langSwitchBtn" data-i18n-title="common.langToggleTitle"></button>
        </span>
      </div>
      <div class="sub" data-i18n="settings.sub"></div>
    </div>

    <div class="card" id="downloadCard">
      <div class="heading" data-i18n="settings.download"></div>
      <div class="hint" data-i18n="settings.downloadHint"></div>
      <div class="io-bar">
        <button type="button" class="btn" id="downloadConfigBtn" data-i18n="settings.downloadConfig"></button>
        <button type="button" class="btn" id="exportSkillsBtn" data-i18n="settings.exportSkills"></button>
        <button type="button" class="btn" id="downloadOtherBtn" data-i18n="settings.downloadOther"></button>
      </div>
    </div>

    <div class="card" id="reloadCard">
      <div class="heading" data-i18n="settings.reload"></div>
      <div class="hint" data-i18n="settings.reloadHint"></div>
      <div class="io-bar">
        <button type="button" class="btn" id="importConfigBtn" data-i18n="settings.importConfig"></button>
        <button type="button" class="btn" id="importSkillsBtn" data-i18n="settings.importSkills"></button>
        <input id="uploadConfigInput" type="file" accept=".json,application/json" hidden>
        <input id="uploadSkillsInput" type="file" accept=".json,application/json" hidden>
      </div>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.diag"></div>
      <div class="hint" data-i18n="settings.diagHint"></div>
      <label class="field">
        <span data-i18n="settings.diagCap"></span>
        <input id="diagCapKb" type="number" min="10" max="200" step="1" value="50">
      </label>
      <div class="hint" data-i18n="settings.diagCapHint"></div>
      <div class="io-bar">
        <button type="button" class="btn danger" id="clearDiagBtn" data-i18n="settings.clearDiag"></button>
      </div>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.ui"></div>
      <label class="field">
        <span data-i18n="settings.uiOpacity"></span>
        <div class="range-row">
          <input id="uiOpacity" type="range" min="20" max="100" step="1" value="80">
          <span class="range-val" id="uiOpacityVal">80%</span>
        </div>
      </label>
      <div class="hint" data-i18n="settings.uiOpacityHint"></div>
      <div class="row-2">
        <label class="field">
          <span data-i18n="settings.scaleX"></span>
          <input id="panelScaleX" type="number" min="30" max="100" step="1" value="50">
        </label>
        <label class="field">
          <span data-i18n="settings.scaleY"></span>
          <input id="panelScaleY" type="number" min="30" max="100" step="1" value="90">
        </label>
      </div>
      <div class="hint" data-i18n="settings.scaleHint"></div>
      <label class="field">
        <span data-i18n="settings.uiFontScale"></span>
        <input id="uiFontScale" type="number" min="50" max="200" step="1" value="100">
      </label>
      <div class="hint" data-i18n="settings.uiFontScaleHint"></div>
    </div>

    <div class="card run-settings">
      <div class="heading" data-i18n="settings.runGlobal"></div>
      <div class="row-2">
        <label class="field"><span data-i18n="panel.maxSteps"></span><input id="maxSteps" type="number" min="1" max="100" step="1" value="100"></label>
        <label class="field"><span data-i18n="panel.llmGap"></span><input id="llmCallGapSec" type="number" min="0" max="10" step="0.1" value="0.5" data-i18n-title="panel.llmGapTitle"></label>
        <label class="field"><span data-i18n="settings.newTabGap"></span><input id="newTabOpenGapSec" type="number" min="0" max="60" step="0.5" value="8" data-i18n-title="settings.newTabGapTitle"></label>
        <label class="field"><span data-i18n="panel.timeoutRetry"></span><input id="llmTimeoutRetry" type="number" min="0" max="3" step="1" value="2"></label>
        <label class="field"><span data-i18n="panel.errorRetry"></span><input id="llmErrorRetry" type="number" min="0" max="5" step="1" value="2"></label>
        <label class="field"><span data-i18n="panel.pageQuiet"></span><input id="pageQuietSec" type="number" min="1" max="15" step="0.5" value="4" data-i18n-title="panel.pageQuietTitle"></label>
        <label class="field"><span data-i18n="panel.suggestWait"></span><input id="suggestWaitSec" type="number" min="0" max="5" step="0.1" value="2" data-i18n-title="panel.suggestWaitTitle"></label>
      </div>
      <div class="pdf-parse-label" data-i18n="panel.pdfScope"></div>
      <label class="check-row"><input id="pdfParseAll" type="radio" name="wpaPdfParseMode" value="all"><span data-i18n="panel.pdfAll"></span></label>
      <label class="check-row"><input id="pdfParsePagesMode" type="radio" name="wpaPdfParseMode" value="pages" checked><span data-i18n="panel.pdfPages"></span></label>
      <div id="pdfParsePagesWrap">
        <label class="field"><span data-i18n="panel.pageNums"></span><input id="pdfParsePages" type="text" value="1,2,3,4,-3,-2,-1" data-i18n-placeholder="panel.pageNumsPh" data-i18n-title="panel.pageNumsTitle"></label>
        <div class="hint" data-i18n="panel.pdfPagesHint"></div>
      </div>
      <div class="hint" id="pdfParseAllHint" hidden data-i18n="panel.pdfAllHint"></div>
      <label class="field"><span data-i18n="settings.pdfTextMax"></span><input id="pdfTextMaxChars" type="number" min="10000" max="500000" step="1000" value="150000" data-i18n-title="settings.pdfTextMaxTitle"></label>
      <div class="hint" data-i18n="settings.pdfTextMaxHint"></div>
      <div class="hint" data-i18n="settings.pdfMineruGlobal"></div>
      <div class="pdf-parse-label" data-i18n="settings.attachBudget"></div>
      <label class="field"><span data-i18n="settings.ocrCacheMax"></span><input id="ocrCacheMaxChars" type="number" min="50000" max="2000000" step="10000" value="500000" data-i18n-title="settings.ocrCacheMaxTitle"></label>
      <div class="hint" data-i18n="settings.ocrCacheHint"></div>
      <label class="field"><span data-i18n="settings.attachContextMax"></span><input id="attachContextMaxChars" type="number" min="10000" max="800000" step="1000" value="300000" data-i18n-title="settings.attachContextMax"></label>
      <div class="hint" data-i18n="settings.attachContextHint"></div>
      <div class="pdf-parse-label" data-i18n="settings.contextBudget"></div>
      <label class="field"><span data-i18n="settings.contextSoft"></span><input id="contextTokenSoft" type="number" min="64000" max="750000" step="10000" value="500000" data-i18n-title="settings.contextSoftTitle"></label>
      <div class="hint" data-i18n="settings.contextSoftHint"></div>
      <label class="field"><span data-i18n="settings.contextHard"></span><input id="contextTokenHard" type="number" min="64000" max="800000" step="10000" value="700000" data-i18n-title="settings.contextHardTitle"></label>
      <div class="hint" data-i18n="settings.contextHardHint"></div>
      <label class="check-row"><input id="busyMaskEnabled" type="checkbox"><span data-i18n="panel.busyMask"></span></label>
      <label class="check-row"><input id="snapshotPiiMask" type="checkbox"><span data-i18n="panel.snapshotPii"></span></label>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.archiveRedact"></div>
      <div class="hint" data-i18n="settings.archiveRedactHint"></div>
      <label class="field">
        <span data-i18n="settings.archiveRedactField"></span>
        <textarea id="archiveRedactHint" rows="5" maxlength="2000"></textarea>
      </label>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.textSysPrompt"></div>
      <div class="hint" data-i18n="settings.textSysHint"></div>
      <label class="field">
        <span data-i18n="settings.textSysField"></span>
        <textarea id="systemPromptText" rows="3" data-i18n-placeholder="settings.textSysPh"></textarea>
      </label>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.textProviders"></div>
      <div class="provider-list" id="textProvidersList"></div>
      <button type="button" class="btn" id="addTextProviderBtn" data-i18n="settings.addTextProvider"></button>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.ocrSysPrompt"></div>
      <div class="hint" data-i18n="settings.ocrSysHint"></div>
      <label class="field">
        <span data-i18n="settings.ocrSysField"></span>
        <textarea id="systemPromptOcr" rows="3" data-i18n-placeholder="settings.ocrSysPh"></textarea>
      </label>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.ocrProviders"></div>
      <div class="provider-list" id="ocrProvidersList"></div>
      <button type="button" class="btn" id="addOcrProviderBtn" data-i18n="settings.addOcrProvider"></button>
    </div>

    <div class="card">
      <div class="heading" data-i18n="settings.webdav"></div>
      <div class="hint" data-i18n="settings.webdavHint"></div>
      <label class="field"><span data-i18n="settings.webdavUrl"></span><input id="webdavUrl" type="text" spellcheck="false" data-i18n-placeholder="settings.webdavUrlPh"></label>
      <label class="field"><span data-i18n="settings.webdavUser"></span><input id="webdavUser" type="text" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span data-i18n="settings.webdavPass"></span><input id="webdavPass" type="password" autocomplete="new-password"></label>
      <label class="field"><span data-i18n="settings.webdavRoot"></span><input id="webdavRoot" type="text" spellcheck="false" data-i18n-placeholder="settings.webdavRootPh"></label>
      <div class="provider-actions">
        <button type="button" class="btn" id="webdavTestBtn" data-i18n="settings.webdavTest"></button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="saveBtn" data-i18n="settings.save"></button>
      <button type="button" class="btn" id="testBtn" data-i18n="settings.testConn"></button>
      <div class="status" id="settingsStatus"></div>
    </div>
  </div>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-backdrop" data-close-modal="resultModal"></div>
    <div class="modal-dialog" role="dialog" aria-labelledby="resultModalTitle" aria-modal="true">
      <button type="button" class="modal-x" data-close-modal="resultModal">×</button>
      <div class="modal-title" id="resultModalTitle" data-i18n="settings.testResult"></div>
      <div class="io-bar" id="resultCopyRow" hidden>
        <button type="button" class="btn" id="resultCopyBtn" data-i18n="common.copy"></button>
        <div class="status" id="resultCopyStatus"></div>
      </div>
      <pre class="modal-pre" id="resultModalBody"></pre>
    </div>
  </div>

  <div class="modal" id="webdavListModal" hidden>
    <div class="modal-backdrop" data-close-modal="webdavListModal"></div>
    <div class="modal-dialog" role="dialog" aria-labelledby="webdavListTitle" aria-modal="true">
      <button type="button" class="modal-x" data-close-modal="webdavListModal">×</button>
      <div class="modal-title" id="webdavListTitle" data-i18n="settings.webdavTestTitle"></div>
      <div class="hint" id="webdavListHint"></div>
      <div class="dav-list-scroll" id="webdavListScroll">
        <div id="webdavList"></div>
      </div>
      <div class="provider-actions dav-list-actions">
        <button type="button" class="btn primary" id="webdavListOk" data-i18n="settings.webdavListOk"></button>
        <button type="button" class="btn" id="webdavListWrong" data-i18n="settings.webdavListWrong"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="exportPickerModal" hidden>
    <div class="modal-backdrop" data-close-modal="exportPickerModal"></div>
    <div class="modal-dialog wide" role="dialog" aria-labelledby="exportPickerTitle" aria-modal="true">
      <button type="button" class="modal-x" data-close-modal="exportPickerModal">×</button>
      <div class="modal-title" id="exportPickerTitle" data-i18n="settings.exportPickerTitle"></div>
      <div class="hint" data-i18n="settings.exportPickerHint"></div>
      <div class="io-bar">
        <button type="button" class="btn primary" id="exportPickerConfirm" data-i18n="settings.exportPickerConfirm"></button>
        <button type="button" class="btn" data-close-modal="exportPickerModal" data-i18n="common.cancel"></button>
      </div>
      <div class="status" id="exportPickerStatus"></div>
      <div id="exportConfigBody"></div>
      <label class="check-row" style="margin-top:10px">
        <input type="checkbox" id="exportPickerIncludeKeys"><span data-i18n="settings.exportKeys"></span>
      </label>
    </div>
  </div>

  <div class="modal" id="exportSkillsModal" hidden>
    <div class="modal-backdrop" data-close-modal="exportSkillsModal"></div>
    <div class="modal-dialog wide" role="dialog" aria-labelledby="exportSkillsTitle" aria-modal="true">
      <button type="button" class="modal-x" data-close-modal="exportSkillsModal">×</button>
      <div class="modal-title" id="exportSkillsTitle" data-i18n="settings.exportSkillsTitle"></div>
      <div class="hint" data-i18n="settings.exportSkillsHint"></div>
      <div class="io-bar">
        <button type="button" class="btn" id="exportSkillsSelectedBtn" data-i18n="common.exportSelected"></button>
        <button type="button" class="btn" id="exportSkillsAllBtn" data-i18n="common.exportAll"></button>
        <button type="button" class="btn" id="skillSelectAllBtn" data-i18n="settings.selectAll"></button>
        <button type="button" class="btn" id="skillInvertBtn" data-i18n="settings.invert"></button>
        <button type="button" class="btn" data-close-modal="exportSkillsModal" data-i18n="common.cancel"></button>
      </div>
      <label class="check-row">
        <input type="checkbox" id="exportSkillValues"><span data-i18n="panel.exportWithPii"></span>
      </label>
      <div id="settingsSkillList" class="skill-export-list"></div>
      <div class="status" id="settingsSkillStatus"></div>
    </div>
  </div>

  <div class="modal" id="exportOtherModal" hidden>
    <div class="modal-backdrop" data-close-modal="exportOtherModal"></div>
    <div class="modal-dialog" role="dialog" aria-labelledby="exportOtherTitle" aria-modal="true">
      <button type="button" class="modal-x" data-close-modal="exportOtherModal">×</button>
      <div class="modal-title" id="exportOtherTitle" data-i18n="settings.exportOtherTitle"></div>
      <div class="hint" data-i18n="settings.exportOtherHint"></div>
      <div class="io-bar">
        <button type="button" class="btn primary" id="downloadOtherConfirm" data-i18n="settings.exportPickerConfirm"></button>
        <button type="button" class="btn" data-close-modal="exportOtherModal" data-i18n="common.cancel"></button>
      </div>
      <div class="status" id="downloadOtherStatus"></div>
      <div id="exportRecordsBody"></div>
    </div>
  </div>
  <div class="modal" id="modelIdModal" hidden>
    <div class="modal-backdrop" data-close-modal="modelIdModal"></div>
    <div class="modal-dialog" role="dialog" aria-labelledby="modelIdModalTitle" aria-modal="true">
      <button type="button" class="modal-x" data-close-modal="modelIdModal">×</button>
      <div class="modal-title" id="modelIdModalTitle" data-i18n="settings.modelIdTitle"></div>
      <div class="hint" data-i18n="settings.modelIdHint"></div>
      <div class="io-bar">
        <button type="button" class="btn primary" id="modelIdConfirm" data-i18n="settings.modelIdConfirm"></button>
        <button type="button" class="btn" id="modelIdSelectAll" data-i18n="settings.selectAll"></button>
        <button type="button" class="btn" id="modelIdInvert" data-i18n="settings.invert"></button>
        <button type="button" class="btn" data-close-modal="modelIdModal" data-i18n="common.cancel"></button>
        <button type="button" class="btn" id="modelIdSort" data-i18n="settings.modelIdSort"></button>
      </div>
      <div class="status" id="modelIdStatus"></div>
      <div id="modelIdList" class="model-id-list"></div>
    </div>
  </div>
  <script src="shared/i18n.js"></script>
  <script src="settings.js"></script>
</body>
</html>
